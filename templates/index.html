<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devora — Conversor efímero a Markdown</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
<main class="mx-auto w-full max-w-3xl px-4 py-8 sm:px-6">
<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
<h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Devora</h1>
<p class="mt-1 text-sm font-medium text-slate-600">Conversor efímero a Markdown — devora documentos, sirve Markdown, no guarda nada.</p>
<p role="note" class="mt-2 rounded-lg bg-emerald-50 px-3 py-2 text-sm text-emerald-900">Nada se guarda en base de datos. El procesamiento es temporal y se purga al terminar.</p>
<form id="form" class="mt-6 flex flex-col gap-3 sm:flex-row sm:items-end">
<div class="flex-1">
<label for="file" class="mb-1 block text-sm font-medium">Documento a convertir</label>
<input id="file" name="file" type="file" required class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm file:mr-3 file:rounded-md file:border-0 file:bg-slate-900 file:px-3 file:py-1.5 file:text-sm file:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">
</div>
<button type="submit" id="convert" class="rounded-lg bg-slate-900 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-700 motion-reduce:transition-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">Convertir</button>
</form>
<p id="estado" role="status" aria-live="polite" class="mt-4 min-h-6 text-sm font-medium"></p>
<section id="resultado" hidden class="mt-4 rounded-xl border border-slate-200 bg-slate-50 p-4 sm:p-5">
<h2 class="text-lg font-semibold">Resultado</h2>
<ul id="avisos" class="mt-2 list-disc space-y-1 pl-5 text-sm text-amber-900"></ul>
<label for="md" class="mb-1 mt-4 block text-sm font-medium">Markdown</label>
<textarea id="md" rows="15" readonly class="w-full rounded-lg border border-slate-300 bg-white p-3 font-mono text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700"></textarea>
<div class="mt-3 flex flex-wrap gap-2">
<button type="button" id="copiar" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium transition hover:bg-slate-100 motion-reduce:transition-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">Copiar Markdown</button>
<button type="button" id="descargar" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium transition hover:bg-slate-100 motion-reduce:transition-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">Descargar .md</button>
<button type="button" id="descartar" class="rounded-lg border border-red-300 bg-white px-4 py-2 text-sm font-medium text-red-700 transition hover:bg-red-50 motion-reduce:transition-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">Descartar</button>
</div>
<p id="confirm" role="status" aria-live="polite" class="mt-2 min-h-6 text-sm font-medium text-emerald-800"></p>
</section>
</div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
